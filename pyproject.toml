[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abstraction"
version = "0.4.0"
description = "Text-free, pair-free music-to-abstract-image generation (research code)"
authors = [
  { name = "Arunav Ganguly" }
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "librosa>=0.8.1",
    "soundfile>=0.12.0",
    "pyyaml>=6.0",
    "wandb>=0.15.0",
    "Pillow>=9.0.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.65.0",
]

[tool.setuptools.packages.find]
include = ["abstraction*"]
