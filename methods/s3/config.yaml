# S3. Self-invented visual language: a mapper paints, a reader identifies the track from the picture.
# None of these values has been validated.
audio_code:
  variant: "mean"           # mean | standardised | whitened
  whiten_dim: 128

vae:                        # only read when --generator spatial_vae (S1 settings)
  latent_channels: 4
  base_channels: 64

mapper:
  hidden: 1024
  depth: 3
  batch_size: 64            # tracks per batch, one window per track
  real_batch_size: 256
  lr: 1.0e-4
  steps: 15000
  swd_projections: 256
  val_every: 500
  amp: false

s3:
  embed_dim: 256            # shared space of the reader and the audio side of the contrastive loss
  reader_hidden: 1024
  reader_lr: 3.0e-4
  temperature: 0.1
  w_lat: 1.0                # sliced Wasserstein of mapped latents to the generator prior
  w_feat: 1.0               # sliced Wasserstein of DINOv2 features of the images to real training art
  w_struct: 1.0             # only in the s3_struct variant
  aug:                      # Arunav 2026-11-21: no flip (it changes the composition); noise and blur kept
    crop_scale: [0.85, 1.0] # light so that composition and detail survive; s3_noaug measures their effect
    noise_std: 0.02         # in image units ([-1, 1] range)
    blur_sigma: 0.6
    blur_prob: 0.3

eval:
  knn_k: 10
  n_permutations: 9999
