# S2. Blind matching of the audio space and the art space by shape (Gromov-Wasserstein); nothing is trained.
# None of these values has been validated.
audio_code:
  variant: "mean"           # mean | standardised | whitened
  whiten_dim: 128
  layers: null

match:
  codes: ["mean", "standardised"]
  epsilon: 0.0005           # final entropic regularisation, in units of the mean distance
  epsilon_start: 0.05       # first value; multiplied by epsilon_decay per step down to epsilon
  epsilon_decay: 0.95
  outer: 300                # linearisation steps
  inner: 200                # Sinkhorn iterations per step
  restarts: 10              # random initial couplings; the lowest objective is reported as the match
  n_null: 5                 # draws of each reference space
  null_restarts: 2          # restarts per reference draw

eval:
  knn_k: 10
  n_permutations: 9999

oos:                        # methods/s2/oos.py
  n_match: 3000             # random training tracks matched to the training paintings
  restarts: 3
  k: 10                     # nearest matched tracks per test track (knn placement)
  alpha: 1.0                # ridge strength, relative to the mean variance of the audio code (linear placement)

cluster:                    # methods/s2/cluster.py (B-cluster)
  k_values: [8, 16, 32]     # groups per collection
  group_restarts: 50        # random restarts of the group-level match
