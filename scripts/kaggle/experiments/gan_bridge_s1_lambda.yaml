description: >-
  S1 with the G-GAN generator, lower structure weight, after the lambda 1 run collapsed most test tracks onto
  one image family (run log 2026-11-21). GPU 0 lambda_struct 0.1, GPU 1 lambda_struct 0.3. Seed 0, 20000
  steps, evaluation on the test split with saved images.
name: abstraction-gan-bridge-s1-lambda
branch: pipeline
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-gan-r1-resume"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
  GAN: gan_r1amp_seed0_20261118T171246Z
setup:
  - nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
  - python -m zipfile -e {ART_ZIP} datasets/
  - ln -s {MERT} datasets/mert_embeddings
chains:
  - - s1 train_mapper --generator gan --vae {GAN}/generator.pt --variant s1 --seed 0 --tag ganl01 --lambda-struct 0.1
    - s1 evaluate --generator gan --vae {GAN}/generator.pt --seed 0 --tag ganl01 --save-images --mapper runs/s1_mapper_s1_ganl01_seed0_*/mapper.pt
  - - s1 train_mapper --generator gan --vae {GAN}/generator.pt --variant s1 --seed 0 --tag ganl03 --lambda-struct 0.3
    - s1 evaluate --generator gan --vae {GAN}/generator.pt --seed 0 --tag ganl03 --save-images --mapper runs/s1_mapper_s1_ganl03_seed0_*/mapper.pt
