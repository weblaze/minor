description: >-
  S3 with the structure term (w_struct 1.0) on the improved G-GAN (run 5, seed 0, step 101996, FD 346), after
  s3_struct on the G-GAN in use (FD 388) named 75 % of test tracks at Mantel r 0.51 and FD 486 (run log
  2026-11-22). GPU 0 s3_struct, GPU 1 plain s3 on the same generator (separates the generator change from the
  structure term). Seed 0, 15000 steps each (time limit 2.75 h), identification and S1 evaluation on the test split.
name: abstraction-s3-struct-gan2
branch: pipeline
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-gan-r1-resume2"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
  GAN: gan_r1amp_seed0_20261121T142711Z
setup:
  - nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
  - python -m zipfile -e {ART_ZIP} datasets/
  - ln -s {MERT} datasets/mert_embeddings
chains:
  - - s3 train --vae {GAN}/generator.pt --variant s3_struct --seed 0 --tag g2w10 --w-struct 1.0 --hours 2.75
    - s3 identify --vae {GAN}/generator.pt --seed 0 --tag g2w10 --run runs/s3_train_s3_struct_g2w10_seed0_*
    - s1 evaluate --generator gan --vae {GAN}/generator.pt --seed 0 --tag s3g2w10 --save-images --mapper runs/s3_train_s3_struct_g2w10_seed0_*/mapper.pt
  - - s3 train --vae {GAN}/generator.pt --variant s3 --seed 0 --tag g2 --hours 2.75
    - s3 identify --vae {GAN}/generator.pt --seed 0 --tag g2 --run runs/s3_train_s3_g2_seed0_*
    - s1 evaluate --generator gan --vae {GAN}/generator.pt --seed 0 --tag s3g2 --save-images --mapper runs/s3_train_s3_g2_seed0_*/mapper.pt
