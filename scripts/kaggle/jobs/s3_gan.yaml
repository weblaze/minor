# S3 with the G-GAN generator (gan_r1amp seed 0, step 57568): mapper and reader trained together on InfoNCE, plus latent and DINOv2-feature distribution terms. GPU 0 variants s3 then s3_noaug, GPU 1 shuffled then random_m. Seed 0, 15000 steps each (time limit 2.75 h per run), identification and S1 evaluation on the test split.
# Generated by scripts/kaggle/make_job.py; edit the experiment file and regenerate.
name: abstraction-s3-gan
branch: pipeline
gpu: true
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-gan-r1-resume"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
  GAN: gan_r1amp_seed0_20261118T171246Z
commands:
  - "nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"
  - "python -m zipfile -e {ART_ZIP} datasets/"
  - "ln -s {MERT} datasets/mert_embeddings"
  - >-
    (set -e; export CUDA_VISIBLE_DEVICES=0;
    python methods/s3/train.py --vae {GAN}/generator.pt --variant s3 --seed 0 --tag gan --hours 2.75;
    python methods/s3/identify.py --vae {GAN}/generator.pt --seed 0 --tag gan --run runs/s3_train_s3_gan_seed0_*;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag s3gan --save-images --mapper runs/s3_train_s3_gan_seed0_*/mapper.pt;
    python methods/s3/train.py --vae {GAN}/generator.pt --variant s3_noaug --seed 0 --tag gan --hours 2.75;
    python methods/s3/identify.py --vae {GAN}/generator.pt --seed 0 --tag gan --run runs/s3_train_s3_noaug_gan_seed0_*;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag s3gan --save-images --mapper runs/s3_train_s3_noaug_gan_seed0_*/mapper.pt;
    ) > runs/gpu0.log 2>&1 & p0=$!;
    (set -e; export CUDA_VISIBLE_DEVICES=1;
    python methods/s3/train.py --vae {GAN}/generator.pt --variant shuffled --seed 0 --tag gan --hours 2.75;
    python methods/s3/identify.py --vae {GAN}/generator.pt --seed 0 --tag gan --run runs/s3_train_shuffled_gan_seed0_*;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag s3gan --save-images --mapper runs/s3_train_shuffled_gan_seed0_*/mapper.pt;
    python methods/s3/train.py --vae {GAN}/generator.pt --variant random_m --seed 0 --tag gan --hours 2.75;
    python methods/s3/identify.py --vae {GAN}/generator.pt --seed 0 --tag gan --run runs/s3_train_random_m_gan_seed0_*;
    ) > runs/gpu1.log 2>&1 & p1=$!;
    wait $p0; r0=$?; wait $p1; r1=$?;
    tail -n 2 runs/gpu0.log runs/gpu1.log;
    exit $((r0 != 0 || r1 != 0))
