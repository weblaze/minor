# Q1 through the G-GAN with CAV-MAE as a weak anchor (methods/s4/bridge.py variant q1_anchor): the Q1 loss plus 0.1 x the S4 audio-visual InfoNCE, after the S4 bridge alone moved images towards their own sound (median rank 136 of 789, shuffled 373) but lost the distance structure (Mantel r 0.06, run log 2026-11-22). GPU 0 w_av 0.1, GPU 1 w_av 0 (Q1 in the same script, same steps: the control). Seed 0, time limit 4.5 h, batch 48, identification by CAV-MAE and S1 evaluation on the test split.
# Generated by scripts/kaggle/make_job.py; edit the experiment file and regenerate.
name: abstraction-q1-anchor-gan
branch: pipeline
gpu: true
datasets:
  - arunavganguly/abstraction-cav-mae
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-gan-r1-resume"
  - "{user}/abstraction-s4-probe"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
  GAN: gan_r1amp_seed0_20261118T171246Z
  CAV: audio_model.21.pth
  CAVEMB: cav_mae_embeddings
commands:
  - "nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"
  - "python -m zipfile -e {ART_ZIP} datasets/"
  - "ln -s {MERT} datasets/mert_embeddings"
  - >-
    (set -e; export CUDA_VISIBLE_DEVICES=0;
    python methods/s4/bridge.py --vae {GAN}/generator.pt --checkpoint {CAV} --embeddings {CAVEMB} --variant q1_anchor --w-av 0.1 --seed 0 --tag a01 --hours 4.5 --batch-size 48;
    python methods/s4/bridge_identify.py --vae {GAN}/generator.pt --checkpoint {CAV} --embeddings {CAVEMB} --seed 0 --tag a01 --run runs/s4_bridge_q1_anchor_a01_seed0_*;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag a01 --save-images --mapper runs/s4_bridge_q1_anchor_a01_seed0_*/mapper.pt;
    ) > runs/gpu0.log 2>&1 & p0=$!;
    (set -e; export CUDA_VISIBLE_DEVICES=1;
    python methods/s4/bridge.py --vae {GAN}/generator.pt --checkpoint {CAV} --embeddings {CAVEMB} --variant q1_anchor --w-av 0 --seed 0 --tag a00 --hours 4.5 --batch-size 48;
    python methods/s4/bridge_identify.py --vae {GAN}/generator.pt --checkpoint {CAV} --embeddings {CAVEMB} --seed 0 --tag a00 --run runs/s4_bridge_q1_anchor_a00_seed0_*;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag a00 --save-images --mapper runs/s4_bridge_q1_anchor_a00_seed0_*/mapper.pt;
    ) > runs/gpu1.log 2>&1 & p1=$!;
    wait $p0; r0=$?; wait $p1; r1=$?;
    tail -n 2 runs/gpu0.log runs/gpu1.log;
    exit $((r0 != 0 || r1 != 0))
