# Continues both mixed-precision R1 G-GAN runs of abstraction-gan-r1-resume from their checkpoint.pt with the flags of the original runs: GPU 0 seed 0 from step 57568, GPU 1 seed 1 from step 26364. Each stops at 150000 steps or after 9 hours.
# Generated by scripts/kaggle/make_job.py; edit the experiment file and regenerate.
name: abstraction-gan-r1-resume2
branch: pipeline
gpu: true
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-gan-r1-resume"
inputs:
  ART_ZIP: abstract_art.zip
  SEED0: gan_r1amp_seed0_20261118T171246Z
  SEED1: gan_r1amp_seed1_20261118T171246Z
commands:
  - "nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"
  - "python -m zipfile -e {ART_ZIP} datasets/"
  - >-
    (set -e; export CUDA_VISIBLE_DEVICES=0;
    python methods/gan/train_gan.py --seed 0 --channels 64 --steps 150000 --no-spectral-norm --r1 10 --amp --tag r1amp --hours 9 --resume {SEED0}/checkpoint.pt;
    ) > runs/gpu0.log 2>&1 & p0=$!;
    (set -e; export CUDA_VISIBLE_DEVICES=1;
    python methods/gan/train_gan.py --seed 1 --channels 64 --steps 150000 --no-spectral-norm --r1 10 --amp --tag r1amp --hours 9 --resume {SEED1}/checkpoint.pt;
    ) > runs/gpu1.log 2>&1 & p1=$!;
    wait $p0; r0=$?; wait $p1; r1=$?;
    tail -n 2 runs/gpu0.log runs/gpu1.log;
    exit $((r0 != 0 || r1 != 0))
