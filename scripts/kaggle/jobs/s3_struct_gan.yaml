# S3 with the S1 structure term (variant s3_struct) through the G-GAN, after s3 named 78 % of test tracks but kept little distance structure (Mantel r 0.18, run log 2026-11-22). GPU 0 w_struct 1.0, GPU 1 w_struct 0.3. Seed 0, 15000 steps each (time limit 2.75 h), identification and S1 evaluation on the test split.
# Generated by scripts/kaggle/make_job.py; edit the experiment file and regenerate.
name: abstraction-s3-struct-gan
branch: pipeline
gpu: true
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-gan-r1-resume"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
  GAN: gan_r1amp_seed0_20261118T171246Z
commands:
  - "nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"
  - "python -m zipfile -e {ART_ZIP} datasets/"
  - "ln -s {MERT} datasets/mert_embeddings"
  - >-
    (set -e; export CUDA_VISIBLE_DEVICES=0;
    python methods/s3/train.py --vae {GAN}/generator.pt --variant s3_struct --seed 0 --tag ganw10 --w-struct 1.0 --hours 2.75;
    python methods/s3/identify.py --vae {GAN}/generator.pt --seed 0 --tag ganw10 --run runs/s3_train_s3_struct_ganw10_seed0_*;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag s3w10 --save-images --mapper runs/s3_train_s3_struct_ganw10_seed0_*/mapper.pt;
    ) > runs/gpu0.log 2>&1 & p0=$!;
    (set -e; export CUDA_VISIBLE_DEVICES=1;
    python methods/s3/train.py --vae {GAN}/generator.pt --variant s3_struct --seed 0 --tag ganw03 --w-struct 0.3 --hours 2.75;
    python methods/s3/identify.py --vae {GAN}/generator.pt --seed 0 --tag ganw03 --run runs/s3_train_s3_struct_ganw03_seed0_*;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag s3w03 --save-images --mapper runs/s3_train_s3_struct_ganw03_seed0_*/mapper.pt;
    ) > runs/gpu1.log 2>&1 & p1=$!;
    wait $p0; r0=$?; wait $p1; r1=$?;
    tail -n 2 runs/gpu0.log runs/gpu1.log;
    exit $((r0 != 0 || r1 != 0))
