# S4 bridge with the G-GAN generator (gan_r1amp seed 0, step 57568): mapper trained so that the frozen CAV-MAE pairs each generated image with its own sound among the batch (InfoNCE against precomputed CAV-MAE audio embeddings of the same window), plus latent and DINOv2-feature distribution terms. GPU 0 variant s4, GPU 1 shuffled. Seed 0, 15000 steps (time limit 4.5 h), batch 48, identification and S1 evaluation on the test split.
# Generated by scripts/kaggle/make_job.py; edit the experiment file and regenerate.
name: abstraction-s4-bridge-gan
branch: pipeline
gpu: true
datasets:
  - arunavganguly/abstraction-cav-mae
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-gan-r1-resume"
  - "{user}/abstraction-s4-probe"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
  GAN: gan_r1amp_seed0_20261118T171246Z
  CAV: audio_model.21.pth
  CAVEMB: cav_mae_embeddings
commands:
  - "nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"
  - "python -m zipfile -e {ART_ZIP} datasets/"
  - "ln -s {MERT} datasets/mert_embeddings"
  - >-
    (set -e; export CUDA_VISIBLE_DEVICES=0;
    python methods/s4/bridge.py --vae {GAN}/generator.pt --checkpoint {CAV} --embeddings {CAVEMB} --variant s4 --seed 0 --tag gan --hours 4.5 --batch-size 48;
    python methods/s4/bridge_identify.py --vae {GAN}/generator.pt --checkpoint {CAV} --embeddings {CAVEMB} --seed 0 --tag gan --run runs/s4_bridge_s4_gan_seed0_*;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag s4gan --save-images --mapper runs/s4_bridge_s4_gan_seed0_*/mapper.pt;
    ) > runs/gpu0.log 2>&1 & p0=$!;
    (set -e; export CUDA_VISIBLE_DEVICES=1;
    python methods/s4/bridge.py --vae {GAN}/generator.pt --checkpoint {CAV} --embeddings {CAVEMB} --variant shuffled --seed 0 --tag gan --hours 4.5 --batch-size 48;
    python methods/s4/bridge_identify.py --vae {GAN}/generator.pt --checkpoint {CAV} --embeddings {CAVEMB} --seed 0 --tag gan --run runs/s4_bridge_shuffled_gan_seed0_*;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag s4gan --save-images --mapper runs/s4_bridge_shuffled_gan_seed0_*/mapper.pt;
    ) > runs/gpu1.log 2>&1 & p1=$!;
    wait $p0; r0=$?; wait $p1; r1=$?;
    tail -n 2 runs/gpu0.log runs/gpu1.log;
    exit $((r0 != 0 || r1 != 0))
