# S1 with the G-GAN generator, lower structure weight, after the lambda 1 run collapsed most test tracks onto one image family (run log 2026-11-21). GPU 0 lambda_struct 0.1, GPU 1 lambda_struct 0.3. Seed 0, 20000 steps, evaluation on the test split with saved images.
# Generated by scripts/kaggle/make_job.py; edit the experiment file and regenerate.
name: abstraction-gan-bridge-s1-lambda
branch: pipeline
gpu: true
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-gan-r1-resume"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
  GAN: gan_r1amp_seed0_20261118T171246Z
commands:
  - "nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"
  - "python -m zipfile -e {ART_ZIP} datasets/"
  - "ln -s {MERT} datasets/mert_embeddings"
  - >-
    (set -e; export CUDA_VISIBLE_DEVICES=0;
    python methods/s1/train_mapper.py --generator gan --vae {GAN}/generator.pt --variant s1 --seed 0 --tag ganl01 --lambda-struct 0.1;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag ganl01 --save-images --mapper runs/s1_mapper_s1_ganl01_seed0_*/mapper.pt;
    ) > runs/gpu0.log 2>&1 & p0=$!;
    (set -e; export CUDA_VISIBLE_DEVICES=1;
    python methods/s1/train_mapper.py --generator gan --vae {GAN}/generator.pt --variant s1 --seed 0 --tag ganl03 --lambda-struct 0.3;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag ganl03 --save-images --mapper runs/s1_mapper_s1_ganl03_seed0_*/mapper.pt;
    ) > runs/gpu1.log 2>&1 & p1=$!;
    wait $p0; r0=$?; wait $p1; r1=$?;
    tail -n 2 runs/gpu0.log runs/gpu1.log;
    exit $((r0 != 0 || r1 != 0))
