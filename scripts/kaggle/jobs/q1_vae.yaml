# Q1 stage 0 and stage A: diagnostics D1-D3, vector VAE, gate (D4), baselines (D5),
# then times the mapper for 200 steps (gate not enforced for the timing run).
# Output: runs/q1_diagnostics_*/, runs/q1_vae_*/vae.pt and gate.json, runs/q1_gate_*/, runs/q1_baselines_*/
name: abstraction-q1-vae
branch: q1-structure
gpu: true
datasets: []
kernels:
  - "{user}/abstraction-features"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
commands:
  - nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
  - python -m zipfile -e {ART_ZIP} datasets/
  - ln -s {MERT} datasets/mert_embeddings
  - python methods/q1/diagnostics.py --seed 0
  - python methods/q1/train_vae.py --seed 0
  - python methods/q1/gate.py --seed 0 --vae runs/q1_vae_seed0_*/vae.pt
  - python methods/q1/baselines.py --seed 0 --vae runs/q1_vae_seed0_*/vae.pt
  - python methods/q1/train_mapper.py --vae runs/q1_vae_seed0_*/vae.pt --variant q1 --seed 0 --steps 200 --ignore-gate
