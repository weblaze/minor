# S1 with the G-GAN generator (gan_r1amp seed 0, step 57568, averaged generator) in place of the VAE; L_dist against prior samples N(0, I). GPU 0 variant s1, GPU 1 variant shuffled and the random-M baseline. Seed 0, 20000 steps, evaluation on the test split with saved images.
# Generated by scripts/kaggle/make_job.py; edit the experiment file and regenerate.
name: abstraction-gan-bridge-s1
branch: pipeline
gpu: true
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-gan-r1-resume"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
  GAN: gan_r1amp_seed0_20261118T171246Z
commands:
  - "nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"
  - "python -m zipfile -e {ART_ZIP} datasets/"
  - "ln -s {MERT} datasets/mert_embeddings"
  - >-
    (set -e; export CUDA_VISIBLE_DEVICES=0;
    python methods/s1/train_mapper.py --generator gan --vae {GAN}/generator.pt --variant s1 --seed 0 --tag gan;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag gan --save-images --mapper runs/s1_mapper_s1_gan_seed0_*/mapper.pt;
    ) > runs/gpu0.log 2>&1 & p0=$!;
    (set -e; export CUDA_VISIBLE_DEVICES=1;
    python methods/s1/train_mapper.py --generator gan --vae {GAN}/generator.pt --variant shuffled --seed 0 --tag gan;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag gan --save-images --mapper runs/s1_mapper_shuffled_gan_seed0_*/mapper.pt;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag ganrandom --save-images;
    ) > runs/gpu1.log 2>&1 & p1=$!;
    wait $p0; r0=$?; wait $p1; r1=$?;
    tail -n 2 runs/gpu0.log runs/gpu1.log;
    exit $((r0 != 0 || r1 != 0))
