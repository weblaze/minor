# Q1 variant q1 on the mean code, seeds 1 and 2 (VAE kl_weight 0.02, gate overridden). One seed per GPU.
name: abstraction-q1-mean-seeds12
branch: q1-structure
gpu: true
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-q1-vae"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
  Q1_VAE: q1_vae_seed0_20261110T155658Z
commands:
  - nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
  - python -m zipfile -e {ART_ZIP} datasets/
  - ln -s {MERT} datasets/mert_embeddings
  - >-
    (set -e; export CUDA_VISIBLE_DEVICES=0;
    python methods/q1/train_mapper.py --seed 1 --code mean --tag meancode --vae {Q1_VAE}/vae.pt --variant q1 --ignore-gate;
    python methods/q1/evaluate.py --seed 1 --tag meancode --vae {Q1_VAE}/vae.pt --mapper runs/q1_mapper_q1_meancode_seed1_*/mapper.pt;
    ) > runs/gpu0.log 2>&1 & p0=$!;
    (set -e; export CUDA_VISIBLE_DEVICES=1;
    python methods/q1/train_mapper.py --seed 2 --code mean --tag meancode --vae {Q1_VAE}/vae.pt --variant q1 --ignore-gate;
    python methods/q1/evaluate.py --seed 2 --tag meancode --vae {Q1_VAE}/vae.pt --mapper runs/q1_mapper_q1_meancode_seed2_*/mapper.pt;
    ) > runs/gpu1.log 2>&1 & p1=$!;
    wait $p0; r0=$?; wait $p1; r1=$?;
    tail -n 2 runs/gpu0.log runs/gpu1.log;
    exit $((r0 + r1))
