# S3 with the structure term (w_struct 1.0) on the improved G-GAN (run 5, seed 0, step 101996, FD 346), after s3_struct on the G-GAN in use (FD 388) named 75 % of test tracks at Mantel r 0.51 and FD 486 (run log 2026-11-22). GPU 0 s3_struct, GPU 1 plain s3 on the same generator (separates the generator change from the structure term). Seed 0, 15000 steps each (time limit 2.75 h), identification and S1 evaluation on the test split.
# Generated by scripts/kaggle/make_job.py; edit the experiment file and regenerate.
name: abstraction-s3-struct-gan2
branch: pipeline
gpu: true
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-gan-r1-resume2"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
  GAN: gan_r1amp_seed0_20261121T142711Z
commands:
  - "nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"
  - "python -m zipfile -e {ART_ZIP} datasets/"
  - "ln -s {MERT} datasets/mert_embeddings"
  - >-
    (set -e; export CUDA_VISIBLE_DEVICES=0;
    python methods/s3/train.py --vae {GAN}/generator.pt --variant s3_struct --seed 0 --tag g2w10 --w-struct 1.0 --hours 2.75;
    python methods/s3/identify.py --vae {GAN}/generator.pt --seed 0 --tag g2w10 --run runs/s3_train_s3_struct_g2w10_seed0_*;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag s3g2w10 --save-images --mapper runs/s3_train_s3_struct_g2w10_seed0_*/mapper.pt;
    ) > runs/gpu0.log 2>&1 & p0=$!;
    (set -e; export CUDA_VISIBLE_DEVICES=1;
    python methods/s3/train.py --vae {GAN}/generator.pt --variant s3 --seed 0 --tag g2 --hours 2.75;
    python methods/s3/identify.py --vae {GAN}/generator.pt --seed 0 --tag g2 --run runs/s3_train_s3_g2_seed0_*;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag s3g2 --save-images --mapper runs/s3_train_s3_g2_seed0_*/mapper.pt;
    ) > runs/gpu1.log 2>&1 & p1=$!;
    wait $p0; r0=$?; wait $p1; r1=$?;
    tail -n 2 runs/gpu0.log runs/gpu1.log;
    exit $((r0 != 0 || r1 != 0))
