# Picker to drawer (project owner, 2026-11-22: contenders draw the image; pickers become teachers). A mapper into the improved G-GAN (run 5, seed 0, step 101996) is trained to draw the F1 description of each window, read by DINOv2 and DINO v1 (methods/gan/teach.py). Each chain first retrains F1 (seed 0, standardised code, 4000 steps) and computes the teacher descriptions (methods/gan/teacher_targets.py), since the descriptions cannot be uploaded as a dataset. GPU 0 teach, GPU 1 shuffled control (descriptions of other tracks). Mean code, seed 0, batch 48, time limit 4 h, then S1 evaluation on the test split.
# Generated by scripts/kaggle/make_job.py; edit the experiment file and regenerate.
name: abstraction-teach-f1-gan
branch: pipeline
gpu: true
kernels:
  - "{user}/abstraction-features"
  - "{user}/abstraction-gan-r1-resume2"
inputs:
  MERT: mert_embeddings
  ART_ZIP: abstract_art.zip
  GAN: gan_r1amp_seed0_20261121T142711Z
commands:
  - "nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"
  - "python -m zipfile -e {ART_ZIP} datasets/"
  - "ln -s {MERT} datasets/mert_embeddings"
  - >-
    (set -e; export CUDA_VISIBLE_DEVICES=0;
    python methods/f1/train_mapper.py --variant f1 --seed 0 --tag t0;
    python methods/gan/teacher_targets.py --teacher runs/f1_mapper_f1_t0_seed0_*/mapper.pt --out runs/teacher_f1_t0;
    python methods/gan/teach.py --vae {GAN}/generator.pt --targets runs/teacher_f1_t0/targets.npz --variant teach --seed 0 --tag f1 --batch 48 --hours 4;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag teachf1 --save-images --mapper runs/teach_teach_f1_seed0_*/mapper.pt;
    ) > runs/gpu0.log 2>&1 & p0=$!;
    (set -e; export CUDA_VISIBLE_DEVICES=1;
    python methods/f1/train_mapper.py --variant f1 --seed 0 --tag t1;
    python methods/gan/teacher_targets.py --teacher runs/f1_mapper_f1_t1_seed0_*/mapper.pt --out runs/teacher_f1_t1;
    python methods/gan/teach.py --vae {GAN}/generator.pt --targets runs/teacher_f1_t1/targets.npz --variant shuffled --seed 0 --tag f1 --batch 48 --hours 4;
    python methods/s1/evaluate.py --generator gan --vae {GAN}/generator.pt --seed 0 --tag teachshuf --save-images --mapper runs/teach_shuffled_f1_seed0_*/mapper.pt;
    ) > runs/gpu1.log 2>&1 & p1=$!;
    wait $p0; r0=$?; wait $p1; r1=$?;
    tail -n 2 runs/gpu0.log runs/gpu1.log;
    exit $((r0 != 0 || r1 != 0))
